<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plataformas 2D - ¡Feliz Cumpleaños!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 840px;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 2px #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Top Bar HUD */
    #top-hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .hud-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 8px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      pointer-events: auto;
      transition: all 0.15s;
    }
    .hud-btn:hover {
      background: #334155;
      transform: translateY(-1px);
    }
    /* Virtual Mobile Touch Controls */
    #touch-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }
    .dpad-container {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.08s, background 0.08s;
      touch-action: manipulation;
    }
    .touch-btn:active, .touch-btn.active {
      transform: scale(0.92);
      background: rgba(56, 189, 248, 0.9);
      border-color: #38bdf8;
      color: #0f172a;
    }
    .action-container {
      pointer-events: auto;
    }
    .jump-btn {
      width: 86px;
      height: 60px;
      font-size: 15px;
      background: rgba(16, 185, 129, 0.85);
      border-color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .jump-btn:active, .jump-btn.active {
      background: #34d399;
      color: #064e3b;
    }
    /* Instructions Footer */
    #instructions {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      display: flex;
      gap: 16px;
    }
    .key-hint {
      background: #1e293b;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Top HUD -->
    <div id="top-hud">
      <div class="hud-badge" id="level-badge">NIVEL 1: TUTORIAL</div>
      <div style="display:flex; gap:8px;">
        <button class="hud-btn" id="sound-btn">🔊 Sonido: ON</button>
        <button class="hud-btn" id="restart-btn">↺ Reiniciar Nivel</button>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls">
      <div class="dpad-container">
        <button class="touch-btn" id="btn-left" aria-label="Izquierda">◀</button>
        <button class="touch-btn" id="btn-right" aria-label="Derecha">▶</button>
      </div>
      <div class="action-container">
        <button class="touch-btn jump-btn" id="btn-jump" aria-label="Saltar">⬆ SALTO</button>
      </div>
    </div>
  </div>

  <div id="instructions">
    <span>Teclado: <span class="key-hint">◀ / A</span> <span class="key-hint">▶ / D</span> para moverte &bull; <span class="key-hint">ESPACIO / ⬆</span> para saltar</span>
    <span>Móvil: Usa los botones táctiles en pantalla</span>
  </div>

    // --- 1. WEB AUDIO 8-BIT SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx && AudioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const now = ctx.currentTime;
      if (type === 'jump') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.13);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'fall') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'door') {
        [330, 440, 554, 659].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + i * 0.07;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.13);
        });
      } else if (type === 'birthday') {
        const notes = [
          { f: 392, d: 0.25 }, { f: 392, d: 0.25 }, { f: 440, d: 0.45 }, { f: 392, d: 0.45 }, { f: 523, d: 0.45 }, { f: 493, d: 0.8 },
          { f: 392, d: 0.25 }, { f: 392, d: 0.25 }, { f: 440, d: 0.45 }, { f: 392, d: 0.45 }, { f: 587, d: 0.45 }, { f: 523, d: 0.9 },
          { f: 392, d: 0.25 }, { f: 392, d: 0.25 }, { f: 784, d: 0.45 }, { f: 659, d: 0.45 }, { f: 523, d: 0.45 }, { f: 493, d: 0.45 }, { f: 440, d: 0.6 },
          { f: 698, d: 0.25 }, { f: 698, d: 0.25 }, { f: 659, d: 0.45 }, { f: 523, d: 0.45 }, { f: 587, d: 0.45 }, { f: 523, d: 1.2 }
        ];
        let elapsed = 0;
        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + elapsed;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + note.d * 0.95);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + note.d);
          elapsed += note.d * 1.05;
        });
      }
    }

    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
    });

    // Mobile Virtual Touch Buttons
    const bindTouch = (elemId, keyProp) => {
      const btn = document.getElementById(elemId);
      const press = (e) => {
        e.preventDefault();
        getAudioCtx();
        keys[keyProp] = true;
        btn.classList.add('active');
      };
      const release = (e) => {
        e.preventDefault();
        keys[keyProp] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    };

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'jump');

    document.getElementById('sound-btn').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔊 Sonido: ON' : '🔇 Sonido: OFF';
      if (soundEnabled) getAudioCtx();
    };

    document.getElementById('restart-btn').onclick = () => {
      setLevel(currentLevel);
    };

    // --- 4. CONFETTI GENERATOR ---
    function spawnConfetti(amount = 140) {
      const colors = ['#f43f5e', '#ec4899', '#a855f7', '#3b82f6', '#06b6d4', '#10b981', '#facc15', '#fb923c'];
      for (let i = 0; i < amount; i++) {
        confetti.push({
          x: CW / 2 + (Math.random() - 0.5) * 120,
          y: 320,
          vx: (Math.random() - 0.5) * 12,
          vy: -6 - Math.random() * 9,
          size: 6 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.2,
          life: 0,
          maxLife: 260 + Math.random() * 120
        });
      }
    }

    // --- 5. SPRITE & GRAPHICS DRAWING ---
    function drawPixelBoy(x, y, w, h, facing, animState, frame) {
      ctx.save();
      ctx.translate(x + w / 2, y + h);
      if (facing === 'left') ctx.scale(-1, 1);

      const px = w / 14;
      const bob = animState === 'walk' ? Math.sin(frame * 0.3) * (2 * px) : Math.sin(frame * 0.1) * (0.8 * px);
      const legOffset = animState === 'walk' ? Math.sin(frame * 0.35) * (4 * px) : 0;
      const isJumping = animState === 'jump';

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, -2, w * 0.45, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      const bodyY = -h + (isJumping ? -3 : bob);

      // Shoes
      ctx.fillStyle = '#1e293b';
      if (isJumping) {
        ctx.fillRect(-5 * px, -6 * px, 4 * px, 5 * px);
        ctx.fillRect(1 * px, -8 * px, 4 * px, 5 * px);
      } else {
        ctx.fillRect(-5 * px - legOffset * 0.5, -4 * px, 4 * px, 4 * px);
        ctx.fillRect(1 * px + legOffset * 0.5, -4 * px, 4 * px, 4 * px);
      }

      // Pants
      ctx.fillStyle = player.pantsColor;
      ctx.fillRect(-5 * px, -11 * px, 10 * px, 7 * px);

      // Shirt
      ctx.fillStyle = player.shirtColor;
      ctx.fillRect(-5 * px, bodyY + 11 * px, 10 * px, 10 * px);

      // Arms
      const armSwing = animState === 'walk' ? Math.cos(frame * 0.35) * (4 * px) : 0;
      ctx.fillRect(-7 * px - armSwing * 0.5, bodyY + 12 * px, 2.5 * px, 7 * px);
      ctx.fillRect(4.5 * px + armSwing * 0.5, bodyY + 12 * px, 2.5 * px, 7 * px);

      // Head
      ctx.fillStyle = player.skinColor;
      ctx.fillRect(-4.5 * px, bodyY + 2 * px, 9 * px, 9 * px);

      // Eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0.5 * px, bodyY + 5 * px, 2.5 * px, 3 * px);

      // Cap
      ctx.fillStyle = player.hatColor;
      ctx.fillRect(-5.5 * px, bodyY + 0.5 * px, 11 * px, 2.5 * px);
      ctx.fillRect(1.5 * px, bodyY + 2 * px, 4.5 * px, 1.5 * px);

      ctx.restore();
    }

    function drawNPC(npc, frame) {
      ctx.save();
      ctx.translate(npc.x + 14, npc.y + 36);
      const px = 2;
      const bounce = Math.sin(frame * 0.08 + npc.type) * 2;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, -2, 12, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = npc.type === 1 ? '#0ea5e9' : '#10b981';
      ctx.fillRect(-5 * px, -26 * px + bounce, 10 * px, 12 * px);

      // Head
      ctx.fillStyle = '#ffd7b5';
      ctx.fillRect(-4 * px, -34 * px + bounce, 8 * px, 8 * px);

      // Eyes
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, -31 * px + bounce, 2 * px, 2 * px);

      // Party Cone Hat
      ctx.fillStyle = npc.type === 1 ? '#f43f5e' : '#8b5cf6';
      ctx.beginPath();
      ctx.moveTo(-3 * px, -34 * px + bounce);
      ctx.lineTo(3 * px, -34 * px + bounce);
      ctx.lineTo(0, -44 * px + bounce);
      ctx.closePath();
      ctx.fill();

      // Balloon on NPC 1
      if (npc.type === 1) {
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-4 * px, -22 * px + bounce);
        const bx = -16 + Math.sin(frame * 0.05) * 4;
        const by = -52 + Math.cos(frame * 0.05) * 3;
        ctx.lineTo(bx, by);
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(bx, by, 8, 11, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawChest(chest, frame) {
      ctx.save();
      ctx.translate(chest.x, chest.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(chest.w / 2, chest.h + 2, chest.w * 0.55, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Base Box
      ctx.fillStyle = '#78350f';
      ctx.fillRect(2, chest.h * 0.4, chest.w - 4, chest.h * 0.6);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(2, chest.h * 0.4, 4, chest.h * 0.6);
      ctx.fillRect(chest.w - 6, chest.h * 0.4, 4, chest.h * 0.6);
      ctx.fillRect(2, chest.h - 4, chest.w - 4, 4);

      if (!isChestOpened) {
        // Closed Lid
        ctx.fillStyle = '#b45309';
        ctx.fillRect(0, chest.h * 0.1, chest.w, chest.h * 0.35);
        ctx.beginPath();
        ctx.arc(chest.w / 2, chest.h * 0.25, chest.w * 0.48, Math.PI, 0);
        ctx.fill();
        // Lock
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(chest.w / 2 - 4, chest.h * 0.38, 8, 10);
      } else {
        // Open Lid
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.moveTo(0, chest.h * 0.4);
        ctx.lineTo(chest.w, chest.h * 0.4);
        ctx.lineTo(chest.w - 4, -chest.h * 0.25);
        ctx.lineTo(4, -chest.h * 0.25);
        ctx.closePath();
        ctx.fill();

        // Shining golden rays
        const glow = ctx.createRadialGradient(chest.w/2, chest.h*0.3, 2, chest.w/2, chest.h*0.3, 35);
        glow.addColorStop(0, 'rgba(253, 224, 71, 0.9)');
        glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(chest.w / 2, chest.h * 0.3, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawDoor(door, frame) {
      ctx.save();
      ctx.translate(door.x, door.y);
      // Stone frame
      ctx.fillStyle = '#475569';
      ctx.fillRect(-3, 0, door.w + 6, door.h);
      ctx.beginPath();
      ctx.arc(door.w / 2, 6, (door.w + 6) / 2, Math.PI, 0);
      ctx.fill();

      // Wooden door
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, 4, door.w, door.h - 4);

      // Knob
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(8, door.h * 0.55, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Portal glow
      const pulse = Math.sin(frame * 0.1) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(56, 189, 248, ${0.4 * pulse})`;
      ctx.fillRect(2, door.h - 4, door.w - 4, 4);

      ctx.restore();
    }

    // --- 6. MAIN GAME LOOP ---
    function update() {
      animFrameCount++;

      // Player Movement Horizontal
      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
      } else {
        player.vx = 0;
      }

      // Player Jump
      if (keys.jump && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
        playSound('jump');
      }

      // Apply Gravity
      player.vy += player.gravity;

      // Update positions
      player.x += player.vx;
      player.y += player.vy;

      // Keep within left/right bounds
      if (player.x < 10) player.x = 10;
      if (player.x + player.w > CW - 10) player.x = CW - 10 - player.w;

      // Check Platforms collision (AABB)
      player.onGround = false;
      for (const plat of levelData.platforms) {
        if (
          player.x + player.w > plat.x &&
          player.x < plat.x + plat.w &&
          player.y + player.h >= plat.y &&
          player.y + player.h <= plat.y + 14 &&
          player.vy >= 0
        ) {
          player.y = plat.y - player.h;
          player.vy = 0;
          player.onGround = true;
          break;
        }
      }

      // Anim state
      if (!player.onGround) {
        player.animState = 'jump';
      } else if (Math.abs(player.vx) > 0.1) {
        player.animState = 'walk';
      } else {
        player.animState = 'idle';
      }

      // Check Pitfall (Nivel 2)
      if (player.y > levelData.pitY) {
        playSound('fall');
        setLevel(currentLevel); // Reinicia el nivel si cae al foso
        return;
      }

      // Check Door Collision (Niveles 1 y 2)
      if (levelData.door) {
        const d = levelData.door;
        if (
          player.x + player.w > d.x &&
          player.x < d.x + d.w &&
          player.y + player.h > d.y &&
          player.y < d.y + d.h
        ) {
          playSound('door');
          setLevel(currentLevel + 1);
          return;
        }
      }

      // Check Chest Collision (Nivel 3)
      if (currentLevel === 3 && levelData.chest && !isChestOpened) {
        const c = levelData.chest;
        if (
          player.x + player.w > c.x &&
          player.x < c.x + c.w &&
          player.y + player.h > c.y &&
          player.y < c.y + c.h
        ) {
          isChestOpened = true;
          playSound('birthday');
          spawnConfetti(180);
        }
      }

      // Update Confetti
      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i];
        p.vy += 0.12; // Gravity
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vRot;
        p.life++;
        if (p.life > p.maxLife || p.y > CH + 40) {
          // If chest still open, cycle some confetti
          if (isChestOpened && Math.random() < 0.3) {
            p.y = -20;
            p.x = Math.random() * CW;
            p.vy = 2 + Math.random() * 3;
            p.life = 0;
          } else {
            confetti.splice(i, 1);
          }
        }
      }

      if (isChestOpened && messageAlpha < 1) {
        messageAlpha += 0.03;
      }
    }

    function render() {
      // Clear Screen
      ctx.fillStyle = currentLevel === 3 ? '#1e1b4b' : '#0f172a';
      ctx.fillRect(0, 0, CW, CH);

      // Background Environment
      if (currentLevel === 1) {
        // Clouds / Sky
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, CW, 380);
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(150, 100, 45, 0, Math.PI * 2);
        ctx.arc(190, 90, 55, 0, Math.PI * 2);
        ctx.arc(230, 100, 40, 0, Math.PI * 2);
        ctx.fill();
      } else if (currentLevel === 2) {
        // Pit / Lava at bottom
        const pitGradient = ctx.createLinearGradient(0, 390, 0, CH);
        pitGradient.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
        pitGradient.addColorStop(1, 'rgba(185, 28, 28, 0.95)');
        ctx.fillStyle = pitGradient;
        ctx.fillRect(0, 390, CW, 60);

        // Hazard spikes / bubbles
        ctx.fillStyle = '#ef4444';
        for (let x = 10; x < CW; x += 30) {
          ctx.beginPath();
          ctx.moveTo(x, CH);
          ctx.lineTo(x + 15, CH - 22);
          ctx.lineTo(x + 30, CH);
          ctx.fill();
        }
      } else if (currentLevel === 3) {
        // Birthday Garland & Flags
        const colors = ['#f43f5e', '#3b82f6', '#facc15', '#10b981', '#a855f7'];
        for (let i = 0; i < 16; i++) {
          ctx.fillStyle = colors[i % colors.length];
          const gx = 40 + i * 45;
          ctx.beginPath();
          ctx.moveTo(gx, 30);
          ctx.lineTo(gx + 40, 30);
          ctx.lineTo(gx + 20, 60);
          ctx.closePath();
          ctx.fill();
        }
      }

      // Draw Platforms
      for (const plat of levelData.platforms) {
        ctx.fillStyle = plat.color;
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);

        // Grass or highlight top
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(plat.x, plat.y, plat.w, 4);

        // Dark underside
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(plat.x, plat.y + plat.h - 4, plat.w, 4);
      }

      // Draw Door (Level 1 & 2)
      if (levelData.door) {
        drawDoor(levelData.door, animFrameCount);
      }

      // Draw Level 3 Elements (Chest, NPCs)
      if (currentLevel === 3) {
        // Draw NPCs
        if (levelData.npcs) {
          levelData.npcs.forEach(npc => drawNPC(npc, animFrameCount));
        }
        // Draw Chest
        if (levelData.chest) {
          drawChest(levelData.chest, animFrameCount);
        }
      }

      // Draw Player
      drawPixelBoy(
        player.x,
        player.y,
        player.w,
        player.h,
        player.facing,
        player.animState,
        animFrameCount
      );

      // Draw Confetti
      for (const p of confetti) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }

      // Instruction Text in Game Canvas
      ctx.textAlign = 'center';
      if (currentLevel === 1) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.fillText(levelData.instruction, CW / 2, 70);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '13px -apple-system, sans-serif';
        ctx.fillText('👉 Avanza hacia la derecha para entrar por la puerta', CW / 2, 100);
      } else if (currentLevel === 2) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.fillText(levelData.instruction, CW / 2, 70);
      } else if (currentLevel === 3) {
        if (!isChestOpened) {
          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 16px -apple-system, sans-serif';
          ctx.fillText('¡Toca el cofre dorado en el centro!', CW / 2, 100);

          // Arrow pointing down to chest
          const bounce = Math.sin(animFrameCount * 0.1) * 6;
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.moveTo(CW / 2, 290 + bounce);
          ctx.lineTo(CW / 2 - 12, 275 + bounce);
          ctx.lineTo(CW / 2 + 12, 275 + bounce);
          ctx.fill();
        } else {
          // HUGE BIRTHDAY CELEBRATION BANNER
          ctx.save();
          ctx.globalAlpha = messageAlpha;

          // Backdrop card
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.fillRect(CW / 2 - 280, 50, 560, 110);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 3;
          ctx.strokeRect(CW / 2 - 280, 50, 560, 110);

          // Main Happy Birthday text
          ctx.fillStyle = '#facc15';
          ctx.font = '900 36px -apple-system, sans-serif';
          ctx.fillText('🎉 ¡FELIZ CUMPLEAÑOS! 🎂', CW / 2, 105);

          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 16px -apple-system, sans-serif';
          ctx.fillText('¡Felicidades en tu día especial! Que lo pases genial', CW / 2, 138);

          ctx.restore();
        }
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Start Game
    setLevel(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
