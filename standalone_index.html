<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plataformas 2D - ¡Feliz Cumpleaños Leslie!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: none;
      padding: 12px 8px;
    }
    @media (min-height: 700px) {
      body {
        justify-content: center;
      }
    }
    .console-chassis {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
      border: 3px solid #334155;
      border-radius: 28px;
      padding: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 11px;
    }
    .console-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .power-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .brand-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #94a3b8;
      letter-spacing: 1px;
    }
    .console-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lvl-btn-group {
      display: flex;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 2px;
    }
    .lvl-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: #e11d48;
      color: #ffffff;
    }
    .icon-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      background: #334155;
      color: #ffffff;
    }
    .screen-bezel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    .screen-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.8);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #facc15;
      padding: 3px 6px;
      border-radius: 4px;
      pointer-events: none;
    }
    .gamepad-panel {
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    .dpad-container {
      display: flex;
      gap: 8px;
    }
    .pad-btn {
      width: 64px;
      height: 64px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #475569;
      border-radius: 16px;
      color: #e2e8f0;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.06s;
    }
    .pad-btn:active, .pad-btn.active {
      transform: scale(0.92);
      border-color: #38bdf8;
      background: linear-gradient(180deg, #0284c7 0%, #0f172a 100%);
      color: #38bdf8;
    }
    .console-middle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0.6;
    }
    .speaker-slits {
      display: flex;
      gap: 4px;
    }
    .slit {
      width: 4px;
      height: 20px;
      background: #334155;
      border-radius: 2px;
      transform: rotate(15deg);
    }
    .console-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      color: #64748b;
    }
    .jump-btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-jump {
      width: 76px;
      height: 64px;
      background: linear-gradient(180deg, #059669 0%, #064e3b 100%);
      border: 2px solid #34d399;
      border-radius: 18px;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 6px 14px rgba(6, 78, 59, 0.6);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.06s;
    }
    .btn-jump:active, .btn-jump.active {
      transform: scale(0.92);
      background: #10b981;
      border-color: #6ee7b7;
    }
    .btn-jump .icon {
      font-size: 14px;
      line-height: 1;
    }
    .footer-help {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="console-chassis">
    <!-- Top Console Bezel -->
    <div class="console-header">
      <div class="console-brand">
        <div class="power-led"></div>
        <span class="brand-text">RETRO BOY 2D</span>
      </div>

      <div class="console-actions">
        <div class="lvl-btn-group">
          <button class="lvl-btn active" id="btn-lvl-1" onclick="setLevel(1)">L1</button>
          <button class="lvl-btn" id="btn-lvl-2" onclick="setLevel(2)">L2</button>
          <button class="lvl-btn" id="btn-lvl-3" onclick="setLevel(3)">L3</button>
        </div>
        <button class="icon-btn" id="sound-btn" title="Sonido">🔊</button>
        <button class="icon-btn" id="restart-btn" title="Reiniciar nivel (Tecla R)">↺</button>
      </div>
    </div>

    <!-- Clean Dedicated Screen (Zero buttons overlaying!) -->
    <div class="screen-bezel">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
      <div class="screen-badge" id="screen-badge">LVL 1</div>
    </div>

    <!-- Dedicated Gamepad Console Below Screen -->
    <div class="gamepad-panel">
      <!-- Left: D-Pad -->
      <div class="dpad-container">
        <button class="pad-btn" id="btn-left" aria-label="Izquierda">◀</button>
        <button class="pad-btn" id="btn-right" aria-label="Derecha">▶</button>
      </div>

      <!-- Center: Speaker Slits -->
      <div class="console-middle">
        <div class="speaker-slits">
          <div class="slit"></div>
          <div class="slit"></div>
          <div class="slit"></div>
        </div>
        <span class="console-name">LESLIE</span>
      </div>

      <!-- Right: Jump Action Button -->
      <div class="jump-btn-container">
        <button class="btn-jump" id="btn-jump" aria-label="Saltar">
          <span class="icon">▲</span>
          <span>SALTO</span>
        </button>
      </div>
    </div>

    <div class="footer-help">
      <span>Controles: Flechas + Espacio</span>
      <span>¡Feliz Cumpleaños Leslie!</span>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioCtx() {
      if (!audioCtx && AudioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const now = ctx.currentTime;
      if (type === 'jump') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.13);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'fall') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'door') {
        [330, 440, 554, 659].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + i * 0.07;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.13);
        });
      } else if (type === 'chest') {
        [261.63, 329.63, 392.0, 523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + idx * 0.06;
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + (idx === 6 ? 0.6 : 0.15));
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + (idx === 6 ? 0.65 : 0.16));
        });
      } else if (type === 'voice') {
        // Procedural 8-bit Celeste / Animal Crossing voice chatter
        const baseFreqs = [480, 540, 620, 680, 760, 840];
        for (let i = 0; i < 16; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + i * 0.055;
          const duration = 0.045;
          const freq = baseFreqs[Math.floor(Math.random() * baseFreqs.length)] + (Math.random() - 0.5) * 60;
          osc.type = Math.random() > 0.4 ? 'square' : 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * (0.92 + Math.random() * 0.22), t + duration);
          gain.gain.setValueAtTime(0.11, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + duration + 0.01);
        }
      } else if (type === 'birthday') {
        const notes = [
          { f: 392, d: 0.25 }, { f: 392, d: 0.25 }, { f: 440, d: 0.45 }, { f: 392, d: 0.45 }, { f: 523, d: 0.45 }, { f: 493, d: 0.8 },
          { f: 392, d: 0.25 }, { f: 392, d: 0.25 }, { f: 440, d: 0.45 }, { f: 392, d: 0.45 }, { f: 587, d: 0.45 }, { f: 523, d: 0.9 },
          { f: 392, d: 0.25 }, { f: 392, d: 0.25 }, { f: 784, d: 0.45 }, { f: 659, d: 0.45 }, { f: 523, d: 0.45 }, { f: 493, d: 0.45 }, { f: 440, d: 0.6 },
          { f: 698, d: 0.25 }, { f: 698, d: 0.25 }, { f: 659, d: 0.45 }, { f: 523, d: 0.45 }, { f: 587, d: 0.45 }, { f: 523, d: 1.2 }
        ];
        let elapsed = 0;
        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t = now + elapsed;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.f, t);
          gain.gain.setValueAtTime(0.18, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + note.d * 0.95);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + note.d);
          elapsed += note.d * 1.05;
        });
      }
    }

    const canvas = document.getElementById('gameCanvas');

    function getLevelData(lvl) {
      if (lvl === 1) {
        return {
          platforms: [
            { x: 40, y: 380, w: 720, h: 50, color: '#166534' },
            { x: 300, y: 290, w: 150, h: 22, color: '#854d0e' }
          ],
          door: { x: 700, y: 310, w: 44, h: 70 },
          spawn: { x: 70, y: 330 },
          pitY: 460
        };
      } else if (lvl === 2) {
        return {
          platforms: [
            { x: 40, y: 360, w: 140, h: 24, color: '#15803d' },
            { x: 260, y: 280, w: 150, h: 24, color: '#15803d' },
            { x: 490, y: 220, w: 150, h: 24, color: '#15803d' },
            { x: 690, y: 190, w: 85, h: 24, color: '#334155' }
          ],
          door: { x: 710, y: 120, w: 44, h: 70 },
          spawn: { x: 60, y: 310 },
          pitY: 425
        };
      } else {
        return {
          platforms: [
            { x: 40, y: 380, w: 720, h: 50, color: '#78350f' }
          ],
          chest: { x: 376, y: 334, w: 48, h: 46 },
          spawn: { x: 80, y: 330 },
          pitY: 460
        };
      }
    }

    let levelData = getLevelData(1);

    function setLevel(lvl) {
      currentLevel = lvl;
      levelData = getLevelData(lvl);
      player.x = levelData.spawn.x;
      player.y = levelData.spawn.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      isChestOpened = false;
      confetti = [];
      messageAlpha = 0;

      document.getElementById('screen-badge').innerText = 'LVL ' + lvl;
      [1, 2, 3].forEach(n => {
        const btn = document.getElementById('btn-lvl-' + n);
        if (btn) btn.classList.toggle('active', n === lvl);
      });
    }

    function spawnConfetti(count) {
      const colors = ['#f43f5e', '#3b82f6', '#facc15', '#10b981', '#a855f7', '#fb923c', '#ffffff'];
      for (let i = 0; i < count; i++) {
        confetti.push({
          x: CW / 2 + (Math.random() - 0.5) * 120,
          y: 310,
          vx: (Math.random() - 0.5) * 15,
          vy: -6 - Math.random() * 11,
          size: 6 + Math.random() * 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          life: 0,
          maxLife: 150 + Math.random() * 100
        });
      }
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (soundEnabled) getAudioCtx();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        keys.jump = true;
        e.preventDefault();
      }
      if (e.code === 'KeyR') setLevel(currentLevel);
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
    });

    // Touch & Mouse Button binding
    function bindTouch(id, keyName) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const start = (e) => {
        e.preventDefault();
        if (soundEnabled) getAudioCtx();
        keys[keyName] = true;
        btn.classList.add('active');
        if (navigator.vibrate) try { navigator.vibrate(12); } catch(err){}
      };
      const end = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-jump', 'jump');

    document.getElementById('restart-btn').addEventListener('click', () => setLevel(currentLevel));
    document.getElementById('sound-btn').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
    });

    // Drawing functions
    function drawMonster(x, y, w, h, id, facing, state, frame) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h - 1, w * 0.45, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(x + w / 2, y + h);
      if (facing === 'left') ctx.scale(-1, 1);

      let bobY = 0;
      let tilt = 0;
      let sx = 1, sy = 1;

      if (state === 'walk') {
        bobY = -Math.abs(Math.sin(frame * 0.35)) * 4;
        tilt = Math.sin(frame * 0.35) * 0.09;
      } else if (state === 'jump') {
        sx = 0.88;
        sy = 1.14;
        bobY = -2;
      } else {
        bobY = Math.sin(frame * 0.08) * 1.5;
        sy = 1 + Math.sin(frame * 0.08) * 0.03;
      }

      ctx.translate(0, bobY);
      ctx.rotate(tilt);
      ctx.scale(sx, sy);

      const img = monsterImages[id];
      if (img && img.complete) {
        ctx.drawImage(img, -w / 2, -h, w, h);
      } else {
        ctx.fillStyle = id === 'pink' ? '#ec4899' : '#0284c7';
        ctx.fillRect(-w / 2, -h, w, h);
      }

      ctx.restore();
    }

    function drawPartyNPC(x, y, w, h, id, frame, dialogue, facing) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;

      const cx = x + w / 2;
      const by = y + h;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(cx, by - 1, w * 0.45, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      const bounce = -Math.abs(Math.sin(frame * 0.25)) * 9;
      ctx.translate(cx, by + bounce);

      ctx.save();
      if (facing === 'left') ctx.scale(-1, 1);
      const img = monsterImages[id];
      if (img && img.complete) {
        ctx.drawImage(img, -w / 2, -h, w, h);
      }

      // Party Cone Hat
      ctx.fillStyle = id === 'dude' ? '#0ea5e9' : '#8b5cf6';
      ctx.beginPath();
      ctx.moveTo(-6, -h + 4);
      ctx.lineTo(6, -h + 4);
      ctx.lineTo(0, -h - 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, -h - 15, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Floating Balloons
      const balloonOffset = facing === 'left' ? 18 : -18;
      const stringWiggle = Math.sin(frame * 0.06) * 4;
      const bX = balloonOffset + stringWiggle;
      const bY = -h - 38 + Math.cos(frame * 0.05) * 3;

      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(facing === 'left' ? 8 : -8, -h + 12);
      ctx.lineTo(bX, bY + 8);
      ctx.stroke();

      ctx.fillStyle = facing === 'left' ? '#06b6d4' : '#f43f5e';
      ctx.beginPath();
      ctx.ellipse(bX - 6, bY - 6, 8, 11, -0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = facing === 'left' ? '#a855f7' : '#facc15';
      ctx.beginPath();
      ctx.ellipse(bX + 6, bY - 12, 8, 11, 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Speech bubble
      if (dialogue) {
        ctx.font = 'bold 12px "Plus Jakarta Sans", sans-serif';
        const textWidth = ctx.measureText(dialogue).width;
        const bw = Math.max(textWidth + 24, 82);
        const bh = 26;
        const bx = -bw / 2;
        const byPos = -h - 44;

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.roundRect(bx + 1, byPos + 2, bw, bh, 8);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(bx, byPos, bw, bh, 8);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-4, byPos + bh);
        ctx.lineTo(4, byPos + bh);
        ctx.lineTo(0, byPos + bh + 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(dialogue, 0, byPos + bh / 2);
      }

      ctx.restore();
    }

    function drawChest(chest, frame) {
      ctx.save();
      ctx.translate(chest.x, chest.y);

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(chest.w / 2, chest.h + 2, chest.w * 0.55, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#78350f';
      ctx.fillRect(2, chest.h * 0.4, chest.w - 4, chest.h * 0.6);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(2, chest.h * 0.4, 4, chest.h * 0.6);
      ctx.fillRect(chest.w - 6, chest.h * 0.4, 4, chest.h * 0.6);
      ctx.fillRect(2, chest.h - 4, chest.w - 4, 4);

      if (!isChestOpened) {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(0, chest.h * 0.1, chest.w, chest.h * 0.35);
        ctx.beginPath();
        ctx.arc(chest.w / 2, chest.h * 0.25, chest.w * 0.48, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(chest.w / 2 - 4, chest.h * 0.38, 8, 10);
      } else {
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.moveTo(0, chest.h * 0.4);
        ctx.lineTo(chest.w, chest.h * 0.4);
        ctx.lineTo(chest.w - 4, -chest.h * 0.25);
        ctx.lineTo(4, -chest.h * 0.25);
        ctx.closePath();
        ctx.fill();

        const glow = ctx.createRadialGradient(chest.w/2, chest.h*0.3, 2, chest.w/2, chest.h*0.3, 35);
        glow.addColorStop(0, 'rgba(253, 224, 71, 0.9)');
        glow.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(chest.w / 2, chest.h * 0.3, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawDoor(door, frame) {
      ctx.save();
      ctx.translate(door.x, door.y);
      ctx.fillStyle = '#475569';
      ctx.fillRect(-3, 0, door.w + 6, door.h);
      ctx.beginPath();
      ctx.arc(door.w / 2, 6, (door.w + 6) / 2, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, 4, door.w, door.h - 4);

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(8, door.h * 0.55, 3.5, 0, Math.PI * 2);
      ctx.fill();

      const pulse = Math.sin(frame * 0.1) * 0.3 + 0.7;
      ctx.fillStyle = 'rgba(56, 189, 248, ' + (0.4 * pulse) + ')';
      ctx.fillRect(2, door.h - 4, door.w - 4, 4);

      ctx.restore();
    }

    function update() {
      animFrameCount++;

      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
      } else {
        player.vx = 0;
      }

      if (keys.jump && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
        playSound('jump');
      }

      player.vy += player.gravity;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 10) player.x = 10;
      if (player.x + player.w > CW - 10) player.x = CW - 10 - player.w;

      player.onGround = false;
      for (const plat of levelData.platforms) {
        if (
          player.x + player.w > plat.x &&
          player.x < plat.x + plat.w &&
          player.y + player.h >= plat.y &&
          player.y + player.h <= plat.y + 14 &&
          player.vy >= 0
        ) {
          player.y = plat.y - player.h;
          player.vy = 0;
          player.onGround = true;
          break;
        }
      }

      if (!player.onGround) {
        player.animState = 'jump';
      } else if (Math.abs(player.vx) > 0.1) {
        player.animState = 'walk';
      } else {
        player.animState = 'idle';
      }

      // Pitfall check (Level 2)
      if (player.y > levelData.pitY) {
        playSound('fall');
        setLevel(currentLevel);
        return;
      }

      // Door Collision (Levels 1 & 2)
      if (levelData.door) {
        const d = levelData.door;
        if (
          player.x + player.w > d.x &&
          player.x < d.x + d.w &&
          player.y + player.h > d.y &&
          player.y < d.y + d.h
        ) {
          playSound('door');
          setLevel(currentLevel + 1);
          return;
        }
      }

      // Chest Collision (Level 3 - Reveal Dude and Owlet!)
      if (currentLevel === 3 && levelData.chest && !isChestOpened) {
        const c = levelData.chest;
        if (
          player.x + player.w > c.x &&
          player.x < c.x + c.w &&
          player.y + player.h > c.y &&
          player.y < c.y + c.h
        ) {
          isChestOpened = true;
          playSound('chest');
          playSound('voice');
          setTimeout(() => {
            playSound('birthday');
          }, 350);
          spawnConfetti(240);
        }
      }

      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i];
        p.vy += 0.1;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vRot;
        p.life++;
        if (p.life > p.maxLife || p.y > CH + 40) {
          if (isChestOpened && Math.random() < 0.25) {
            p.y = -20;
            p.x = Math.random() * CW;
            p.vy = 2 + Math.random() * 3;
            p.life = 0;
          } else {
            confetti.splice(i, 1);
          }
        }
      }

      if (isChestOpened && messageAlpha < 1) {
        messageAlpha = Math.min(1, messageAlpha + 0.025);
      }
    }

    function render() {
      ctx.clearRect(0, 0, CW, CH);

      // Backgrounds
      if (currentLevel === 1) {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, CH);
        bgGrad.addColorStop(0, '#0f172a');
        bgGrad.addColorStop(0.7, '#1e293b');
        bgGrad.addColorStop(1, '#090d16');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, CW, CH);

        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath();
        ctx.arc(140, 110, 50, 0, Math.PI * 2);
        ctx.arc(180, 95, 60, 0, Math.PI * 2);
        ctx.arc(230, 110, 45, 0, Math.PI * 2);
        ctx.fill();
      } else if (currentLevel === 2) {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, CH);
        bgGrad.addColorStop(0, '#180d24');
        bgGrad.addColorStop(0.7, '#2e1065');
        bgGrad.addColorStop(1, '#450a0a');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, CW, CH);

        const pitGradient = ctx.createLinearGradient(0, 385, 0, CH);
        pitGradient.addColorStop(0, 'rgba(239, 68, 68, 0.2)');
        pitGradient.addColorStop(0.4, 'rgba(220, 38, 38, 0.7)');
        pitGradient.addColorStop(1, '#7f1d1d');
        ctx.fillStyle = pitGradient;
        ctx.fillRect(0, 385, CW, CH - 385);

        ctx.fillStyle = '#ef4444';
        for (let x = 10; x < CW; x += 28) {
          ctx.beginPath();
          ctx.moveTo(x, CH);
          ctx.lineTo(x + 14, CH - 26);
          ctx.lineTo(x + 28, CH);
          ctx.fill();
        }
      } else {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, CH);
        bgGrad.addColorStop(0, '#1e1b4b');
        bgGrad.addColorStop(0.6, '#312e81');
        bgGrad.addColorStop(1, '#1e1136');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, CW, CH);

        const colors = ['#f43f5e', '#3b82f6', '#facc15', '#10b981', '#a855f7', '#fb923c'];
        for (let i = 0; i < 17; i++) {
          const gx = 45 + i * 42;
          const gy = 34 + Math.sin((i / 16) * Math.PI) * 12;
          ctx.fillStyle = colors[i % colors.length];
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          ctx.lineTo(gx + 32, gy);
          ctx.lineTo(gx + 16, gy + 28);
          ctx.closePath();
          ctx.fill();
        }
      }

      // Platforms
      for (const plat of levelData.platforms) {
        ctx.fillStyle = plat.color;
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(plat.x, plat.y, plat.w, 4);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(plat.x, plat.y + plat.h - 4, plat.w, 4);
      }

      // Door (Levels 1 & 2)
      if (levelData.door) {
        drawDoor(levelData.door, animFrameCount);
      }

      // Level 3: Dude and Owlet appear ONLY upon touching chest!
      if (currentLevel === 3) {
        if (isChestOpened) {
          drawPartyNPC(230, 346, 32, 34, 'dude', animFrameCount, '¡Sorpresa!', 'right');
          drawPartyNPC(530, 346, 32, 34, 'owlet', animFrameCount, '¡Feliz Cumple!', 'left');
        }

        if (levelData.chest) {
          drawChest(levelData.chest, animFrameCount);
        }
      }

      // Draw Player Monster (Pink Monster - Leslie)
      drawMonster(
        player.x,
        player.y,
        player.w,
        player.h,
        'pink',
        player.facing,
        player.animState,
        animFrameCount
      );

      // Confetti
      for (const p of confetti) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
        ctx.restore();
      }

      // HUD & Instructions
      ctx.textAlign = 'center';
      if (currentLevel === 1) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#050811';
        ctx.fillText('Usa ◀ ▶ para moverte y ▲ / ESPACIO para saltar', CW / 2 + 1, 61);
        ctx.fillStyle = '#f8fafc';
        ctx.fillText('Usa ◀ ▶ para moverte y ▲ / ESPACIO para saltar', CW / 2, 60);

        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = '#050811';
        ctx.fillText('▶ Llega a la puerta dorada de la derecha ▶', CW / 2 + 1, 89);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('▶ Llega a la puerta dorada de la derecha ▶', CW / 2, 88);
      } else if (currentLevel === 2) {
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#050811';
        ctx.fillText('¡CUIDADO CON EL FOSO DE LAVA!', CW / 2 + 1, 61);
        ctx.fillStyle = '#f87171';
        ctx.fillText('¡CUIDADO CON EL FOSO DE LAVA!', CW / 2, 60);

        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = '#050811';
        ctx.fillText('Salta con precision entre las 3 plataformas', CW / 2 + 1, 85);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('Salta con precision entre las 3 plataformas', CW / 2, 84);
      } else if (currentLevel === 3) {
        if (!isChestOpened) {
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.fillStyle = '#050811';
          ctx.fillText('¡TOCA EL COFRE DORADO EN EL CENTRO!', CW / 2 + 1, 71);
          ctx.fillStyle = '#facc15';
          ctx.fillText('¡TOCA EL COFRE DORADO EN EL CENTRO!', CW / 2, 70);

          const bounce = Math.sin(animFrameCount * 0.1) * 6;
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.moveTo(CW / 2, 285 + bounce);
          ctx.lineTo(CW / 2 - 12, 270 + bounce);
          ctx.lineTo(CW / 2 + 12, 270 + bounce);
          ctx.closePath();
          ctx.fill();
        } else {
          // CELEBRATION OVERLAY BANNER FOR LESLIE
          ctx.save();
          ctx.globalAlpha = messageAlpha;

          const cardW = 690;
          const cardH = 175;
          const cardX = CW / 2 - cardW / 2;
          const cardY = 24;

          ctx.fillStyle = 'rgba(3, 7, 18, 0.95)';
          ctx.beginPath();
          ctx.roundRect(cardX, cardY, cardW, cardH, 14);
          ctx.fill();

          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
          ctx.lineWidth = 1;
          ctx.strokeRect(cardX + 4, cardY + 4, cardW - 8, cardH - 8);

          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 17px "Press Start 2P", monospace';
          ctx.fillText('¡FELIZ CUMPLEAÑOS LESLIE! 🎉', CW / 2, cardY + 36);

          ctx.fillStyle = '#f8fafc';
          ctx.font = '600 13px "Plus Jakarta Sans", sans-serif';
          ctx.fillText(
            'Leslie, otro nivel desbloqueado en esta aventura que es tu vida.',
            CW / 2,
            cardY + 68
          );
          ctx.fillText(
            'Te deseo lo mejor, gracias por ser tan buena amiga, nunca cambies tu forma de ser.',
            CW / 2,
            cardY + 92
          );

          ctx.fillStyle = 'rgba(244, 63, 94, 0.2)';
          ctx.beginPath();
          ctx.roundRect(cardX + 28, cardY + 114, cardW - 56, 38, 8);
          ctx.fill();
          ctx.strokeStyle = 'rgba(244, 63, 94, 0.65)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.fillStyle = '#fda4af';
          ctx.font = 'bold 12px "Plus Jakarta Sans", sans-serif';
          ctx.fillText(
            '🎟️ Nota: cupón válido para hacerle una garra del tigre al goldo <3',
            CW / 2,
            cardY + 138
          );

          ctx.restore();
        }
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    setLevel(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
